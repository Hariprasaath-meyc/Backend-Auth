
version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-south-1

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - |
        if [ -z "$REPOSITORY_URI" ]; then
          echo "ERROR: REPOSITORY_URI was not supplied by CodeBuild"
          exit 1
        fi
      - |
        if [ -z "$CODEBUILD_RESOLVED_SOURCE_VERSION" ]; then
          echo "ERROR: Unable to determine the source commit"
          exit 1
        fi
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}"
      - export POSTGRES_IMAGE_TAG="${IMAGE_TAG}-postgres"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$(echo "$REPOSITORY_URI" | cut -d/ -f1)"
      - 'echo "Repository URI: $REPOSITORY_URI"'
      - 'echo "API image tag: $IMAGE_TAG"'
      - 'echo "PostgreSQL image tag: $POSTGRES_IMAGE_TAG"'

  build:
    commands:
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}"
      - export POSTGRES_IMAGE_TAG="${IMAGE_TAG}-postgres"
      - 'echo "Building the API image"'
      - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .
      - docker tag "$REPOSITORY_URI:$IMAGE_TAG" "$REPOSITORY_URI:api"
      - echo "Building the custom PostgreSQL image with initialization scripts"
      - docker build -f dockerfile.postgres -t "$REPOSITORY_URI:$POSTGRES_IMAGE_TAG" .
      - docker tag "$REPOSITORY_URI:$POSTGRES_IMAGE_TAG" "$REPOSITORY_URI:postgres"

  post_build:
    commands:
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}"
      - export POSTGRES_IMAGE_TAG="${IMAGE_TAG}-postgres"
      - echo "Pushing API images to ECR"
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$REPOSITORY_URI:api"
      - echo "Pushing PostgreSQL images to ECR"
      - docker push "$REPOSITORY_URI:$POSTGRES_IMAGE_TAG"
      - docker push "$REPOSITORY_URI:postgres"
      - echo "Creating imagedefinitions.json"
      - printf '[{"name":"authflow-api","imageUri":"%s:%s"},{"name":"db","imageUri":"%s:%s"}]' "$REPOSITORY_URI" "$IMAGE_TAG" "$REPOSITORY_URI" "$POSTGRES_IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json
      - echo "API and PostgreSQL images pushed successfully"

artifacts:
  files:
    - imagedefinitions.json
