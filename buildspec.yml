version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-south-1
    REPOSITORY_NAME: ci/cd-flow-repository

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 369606757523.dkr.ecr.ap-south-1.amazonaws.com

      - REPOSITORY_URI=369606757523.dkr.ecr.ap-south-1.amazonaws.com/ci/cd-flow-repository

      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - IMAGE_TAG=${IMAGE_TAG:0:7}
      - POSTGRES_IMAGE_TAG=${IMAGE_TAG}-postgres

  build:
    commands:
      - echo Building the API image
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:api

      - echo Building the custom PostgreSQL image with initialization scripts
      - docker build -f dockerfile.postgres -t $REPOSITORY_URI:$POSTGRES_IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$POSTGRES_IMAGE_TAG $REPOSITORY_URI:postgres

  post_build:
    commands:
      - echo Pushing API images to ECR

      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:api


      - echo "Pushing PostgreSQL images"

      - docker push "$REPOSITORY_URI:$POSTGRES_IMAGE_TAG"
      - docker push "$REPOSITORY_URI:postgres"

      - echo "API and PostgreSQL images pushed successfully"

      - echo "Creating imagedefinitions.json"
      - |
      
        printf '[{"name":"py","imageUri":"%s:%s"}]' \
          "$REPOSITORY_URI" "$IMAGE_TAG" > imagedefinitions.json

        cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
